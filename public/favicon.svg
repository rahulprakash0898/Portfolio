<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="24" fill="#08090e" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#rpGrad)" stroke-width="3" opacity="0.8" />
  
  <!-- Glowing Monogram Text -->
  <text x="50" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="url(#rpGrad)" text-anchor="middle" letter-spacing="1" filter="url(#glow)">RP</text>
  <text x="50" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">RP</text>
  
  <!-- Small Cyber Corner Node -->
  <circle cx="82" cy="18" r="4" fill="#22d3ee" />
</svg>
